name: Release

on:
  push:
    tags: ["v*"]

jobs:
  on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      # The server downloads the web UI for its own version, so it must match the tag.
      # This also checks the frontend's package.json files, which aren't strictly required
      # to match, but it's a semantic I think is worth keeping.
      - run: |
          fail=0
          check() { [ "$2" = "${GITHUB_REF_NAME#v}" ] || { echo "::error file=$1::version is $2, but the tag is $GITHUB_REF_NAME"; fail=1; }; }
          check backend/server/Cargo.toml "$(sed -n 's/^version = "\(.*\)"/\1/p' backend/server/Cargo.toml)"
          for f in frontend/apps/desktop/src-tauri/tauri.conf.json frontend/apps/*/package.json frontend/packages/*/package.json; do
            check "$f" "$(jq -r .version "$f")"
          done
          exit $fail

  server:
    needs: on-main
    strategy:
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: windows-latest, name: windows-x86_64, ext: .exe }
          - { os: macos-latest, name: macos-aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p lorealm_server
        working-directory: backend
      - run: mv backend/target/release/lorealm_server${{ matrix.ext }} lorealm-server-${{ matrix.name }}${{ matrix.ext }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: lorealm-server-*

  web:
    needs: on-main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - working-directory: frontend
        run: |
          bun install --frozen-lockfile
          (cd packages/ui && bun run prepack)
          (cd apps/web && bun run build)
          (cd apps/web/dist && zip -r "$GITHUB_WORKSPACE/lorealm-web.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: lorealm-web.zip

  desktop:
    needs: on-main
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - working-directory: frontend
        shell: bash
        run: |
          bun install --frozen-lockfile
          (cd packages/ui && bun run prepack)
          (cd apps/desktop && bun run tauri build)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.AppImage
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.deb
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.rpm
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.msi
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.exe
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.dmg
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.app.tar.gz
            frontend/apps/desktop/src-tauri/target/release/bundle/*/*.sig

  release:
    needs: [server, web, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          mkdir assets && find out -type f -exec mv -t assets {} +
          cd assets
          shopt -s nullglob
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          platforms='{}'
          for sig in *.sig; do
            file="${sig%.sig}"
            case "$file" in
              *.AppImage) key=linux-x86_64-appimage ;;
              *.deb) key=linux-x86_64-deb ;;
              *.rpm) key=linux-x86_64-rpm ;;
              *-setup.exe) key=windows-x86_64-nsis ;;
              *.msi) key=windows-x86_64-msi ;;
              *.app.tar.gz) key=darwin-aarch64-app ;;
              *) echo "::error::no updater platform for $file"; exit 1 ;;
            esac
            [ -f "$file" ] || { echo "::error::$sig has no matching bundle"; exit 1; }
            platforms=$(jq --arg k "$key" --rawfile sig "$sig" --arg url "$base/$file" \
              '. + {($k): {signature: ($sig | rtrimstr("\n")), url: $url}}' <<<"$platforms")
          done
          [ "$platforms" != '{}' ] || { echo "::error::no signed update bundles were built"; exit 1; }
          jq -n --arg v "${GITHUB_REF_NAME#v}" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $d, platforms: $p}' > latest.json
          jq . latest.json

          sha256sum * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --repo "$GITHUB_REPOSITORY" *
        env:
          GH_TOKEN: ${{ github.token }}
