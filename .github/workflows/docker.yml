name: Docker

# Builds staging into :nightly every day at 00:00 UTC; publishing a release publishes :<version> and :latest.
on:
  schedule:
    - cron: "0 0 * * *"
  release:
    types: [published]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Scheduled runs always start on the default branch.
          ref: ${{ github.event_name == 'schedule' && 'staging' || github.ref }}
          fetch-depth: 0
      - if: github.event_name == 'release'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - id: tags
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            echo "tags=$image:${GITHUB_REF_NAME#v},$image:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$image:nightly" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
