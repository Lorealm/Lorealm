[package]
name = "lorealm_storage"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography and validation
sha2 = "0.11"

# Database backends (optional features)
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio-rustls", "chrono"], optional = true }

# Redis caching
redis = { version = "1", features = ["tokio-comp", "connection-manager"], optional = true }
serde_yaml = "0.9.34"
bytes = "1.11.1"
hex = "0.4.3"

[dev-dependencies]
# Testing framework
tokio-test = "0.4"
proptest = "1"
proptest-derive = "0.4"
test-case = "3"
mockall = "0.12"
serial_test = "3"

# Temporary directories for file testing
tempfile = "3"

# For async testing
futures = "0.3"

[features]
default = ["postgres", "redis", "test-utils"]
postgres = ["sqlx"]
redis = ["dep:redis"]
all = ["postgres", "redis"]

# Test utilities
test-utils = []
