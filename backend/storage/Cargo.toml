[package]
name = "lorealm_storage"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
# Async runtime
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Time
chrono = { workspace = true, features = ["serde"] }

# Cryptography and validation
sha2 = "0.11"

# Database backends (optional features)
sqlx = { version = "0.8.6", features = ["postgres", "sqlite", "runtime-tokio-rustls", "chrono"], optional = true }

# Redis caching
redis = { version = "1", features = ["tokio-comp", "connection-manager"], optional = true }
serde_yaml = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# Testing framework
tokio-test = "0.4"
proptest = "1"
proptest-derive = "0.4"
test-case = "3"
mockall = "0.12"
serial_test = "3"

# Temporary directories for file testing
tempfile = { workspace = true }

# For async testing
futures = { workspace = true }

[features]
default = ["postgres", "sqlite", "redis", "test-utils"]
postgres = ["sqlx"]
sqlite = ["sqlx"]
redis = ["dep:redis"]
all = ["postgres", "sqlite", "redis"]

# Test utilities
test-utils = []
