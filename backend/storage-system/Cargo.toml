[package]
name = "storage-system"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Cryptography and validation
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }

# Database backends (optional features)
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "chrono", "uuid"], optional = true }
surrealdb = { version = "1", optional = true }

# Redis caching
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"], optional = true }

[dev-dependencies]
# Testing framework
tokio-test = "0.4"
proptest = "1"
proptest-derive = "0.4"
test-case = "3"
mockall = "0.12"
serial_test = "3"

# Temporary directories for file testing
tempfile = "3"

# For async testing
futures = "0.3"

[features]
default = ["postgres", "redis", "test-utils"]
postgres = ["sqlx"]
surrealdb_backend = ["surrealdb"]
redis = ["dep:redis"]
all = ["postgres", "surrealdb_backend", "redis"]

# Test utilities
test-utils = []

[[test]]
name = "integration"
path = "tests/integration/mod.rs"