[package]
name = "eldoria-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros", "multipart"] }  # Core web framework
tokio = { version = "1", features = ["full"] }    # Async runtime
tower-http = { version = "0.6.6", features = ["cors"] }  # For CORS middleware
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
thiserror = { workspace = true }
anyhow = { workspace = true }

# In-house dependencies
storage-system = { path = "../storage-system" }
encryption-service = { path = "../encryption-service" }
serde_yaml = "0.9.34"
bitflags = "2.10.0"
uuid = "1.18.1"
chrono = "0.4.42"
dotenv = "0.15.0"
regex = "1.12.2"
rand = "0.9.2"
base64 = "0.22.1"
crc32fast = "1.5.0"
tower-cookies = "0.11.0"
axum-extra = { version = "0.12.1", features = ["cookie"] }
secrecy = "0.10.3"

[dev-dependencies]
axum-test = "18.2.1"  # For testing handlers
