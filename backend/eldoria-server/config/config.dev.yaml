# Eldoria Hub Server Configuration
# This file configures backends, caching, security, and other server options.
# Environment-specific overrides can be handled via env vars or separate files (e.g., dev.yaml, prod.yaml).

backends:
  - type: postgres
    connection_string: postgresql://user:pass@localhost/llm_db
    max_connections: 20
  - type: file
    base_path: ./fallback_data
    pretty: true

require_postgres_fallback: false

cache:
  redis_url: redis://localhost:6379/0
  ttl_seconds: 600
  key_prefix: llm_frontend

# Security settings (e.g., for CORS and CSRF)
security:
  cors_origins:
    - http://localhost:3000 # Frontend dev origin
    - https://your-frontend-domain.com # Prod origin
  csrf_secret: your_super_secret_key_here # Generate a strong random secret

# Server settings
server:
  host: 0.0.0.0
  port: 3000
  log_level: debug

# Optional: Plugin configurations
plugins:
  enabled: true
  paths:
    - ./plugins/backend.wasm
