<style>
	body { margin: 0; padding: 14px 10px 12px; }
	.note {
		position: relative;
		max-width: 75%;
		background-color: var(--color-bg-elevated);
		background-image: var(--gradient-subtle);
		border: 1px solid var(--color-border-medium);
		border-radius: var(--radius-sm);
		padding: var(--spacing-lg) var(--spacing-md);
		font-family: var(--font-family-body-alt);
		font-style: italic;
		color: var(--color-text-primary);
		line-height: var(--line-height-normal);
		white-space: pre-wrap;
		overflow-wrap: anywhere;
		transform: rotate(-0.5deg);
		box-shadow: var(--shadow-md);
	}
	.note::before {
		content: '';
		position: absolute;
		top: -9px;
		left: 50%;
		width: 60px;
		height: 18px;
		transform: translateX(-50%) rotate(1.5deg);
		background: var(--color-primary-light);
		opacity: 0.3;
		border-radius: var(--radius-sm);
	}
</style>
<div class="note" data-prop="content"></div>
<script>
addEventListener("message", (e) => {
	if (e.data?.type !== "lorealm:props") return;
	for (const el of document.querySelectorAll("[data-prop]")) {
		const v = e.data.props[el.dataset.prop];
		el.textContent = v == null ? "" : String(v);
		el.style.display = el.textContent ? "" : "none";
	}
});
</script>
