<style>
	body { margin: 0; padding: 4px 10px 12px; }
	.sign {
		width: fit-content;
		max-width: 75%;
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: var(--spacing-xs);
		padding: var(--spacing-md) var(--spacing-xl);
		text-align: center;
		background:
			radial-gradient(circle at 10px 10px, #1f130a 2px, transparent 3px),
			radial-gradient(circle at calc(100% - 10px) 10px, #1f130a 2px, transparent 3px),
			radial-gradient(circle at 10px calc(100% - 10px), #1f130a 2px, transparent 3px),
			radial-gradient(circle at calc(100% - 10px) calc(100% - 10px), #1f130a 2px, transparent 3px),
			linear-gradient(180deg, #5b3a21 0%, #3a2413 100%);
		border: 2px solid #2a1a0d;
		border-radius: var(--radius-sm);
		box-shadow: inset 0 1px 0 rgba(255, 220, 170, 0.12), var(--shadow-md);
	}
	.title {
		font-family: var(--font-family-heading);
		text-transform: uppercase;
		letter-spacing: var(--letter-spacing-uppercase);
		color: #d8b885;
		text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.6);
	}
	.subtitle { font-family: var(--font-family-body); font-size: var(--font-size-sm); color: #b89066; }
</style>
<div class="sign">
	<span class="title" data-prop="title"></span>
	<span class="subtitle" data-prop="subtitle"></span>
</div>
<script>
addEventListener("message", (e) => {
	if (e.data?.type !== "lorealm:props") return;
	for (const el of document.querySelectorAll("[data-prop]")) {
		const v = e.data.props[el.dataset.prop];
		el.textContent = v == null ? "" : String(v);
		el.style.display = el.textContent ? "" : "none";
	}
});
</script>
