<style>
	body { margin: 0; padding: 4px 10px 12px; }
	.sms { display: flex; flex-direction: column; gap: var(--spacing-xs); max-width: 75%; }
	.outgoing { margin-left: auto; align-items: flex-end; }
	.incoming { margin-right: auto; align-items: flex-start; }
	.sender {
		color: var(--color-text-muted);
		font-family: var(--font-family-heading);
		font-size: var(--font-size-xs);
		letter-spacing: var(--letter-spacing-uppercase);
		text-transform: uppercase;
		padding: 0 var(--spacing-md);
	}
	.bubble {
		position: relative;
		width: fit-content;
		color: var(--color-text-inverse);
		font-family: var(--font-family-body);
		border-radius: var(--radius-lg);
		padding: var(--spacing-sm) var(--spacing-md);
		line-height: var(--line-height-normal);
		white-space: pre-wrap;
		overflow-wrap: anywhere;
		box-shadow: var(--shadow-sm);
	}
	.bubble::after { content: ''; position: absolute; bottom: 0; width: 12px; height: 14px; }
	.outgoing .bubble {
		background: linear-gradient(180deg, var(--color-role-user-text) 0%, var(--color-role-user) 100%);
		border-bottom-right-radius: var(--radius-sm);
	}
	.outgoing .bubble::after {
		right: -6px;
		background: var(--color-role-user);
		clip-path: polygon(0 0, 0 100%, 100% 100%);
	}
	.incoming .bubble {
		background: linear-gradient(180deg, var(--color-role-assistant-text) 0%, var(--color-role-assistant) 100%);
		border-bottom-left-radius: var(--radius-sm);
	}
	.incoming .bubble::after {
		left: -6px;
		background: var(--color-role-assistant);
		clip-path: polygon(100% 0, 100% 100%, 0 100%);
	}
</style>
<div class="sms DIRECTION">
	<span class="sender" data-prop="sender"></span>
	<div class="bubble" data-prop="content"></div>
</div>
<script>
addEventListener("message", (e) => {
	if (e.data?.type !== "lorealm:props") return;
	for (const el of document.querySelectorAll("[data-prop]")) {
		const v = e.data.props[el.dataset.prop];
		el.textContent = v == null ? "" : String(v);
		el.style.display = el.textContent ? "" : "none";
	}
});
</script>
