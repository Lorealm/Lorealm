[package]
name = "lorealm_server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# In-house dependencies
lorealm_storage = { path = "../storage" }
lorealm_encryption = { path = "../encryption" }
lorealm_providers = { path = "../llm_providers"}
lorealm_plugins = { path = "../plugins" }

# Workspace dependencies
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = { workspace = true }
schemars = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }

# Project-specific dependencies
axum = { version = "0.8.8", features = ["macros", "multipart"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "set-header"] }
dotenv = "0.15.0"
tower-cookies = "0.11.0"
rand = "0.10.0"
rand_core = "0.10.0"
secrecy = "0.10.3"
unicode-normalization = "0.1.25"
futures-util = "0.3.32"
bitflags = { version = "2.11.0", features = ["serde"] }
crc32fast = "1.5.0"
weaver_lang = { version = "0.10.0", features = ["macros", "serde", "wtn", "modules"]}
context_weaver = "0.5.5"
regex = "1.12.3"
infer = "0.19.0"
async-stream = "0.3.6"
weaver_macros = "0.3.0"
tokio-util = "0.7.18"
dashmap = "6.2.1"
kitoken = { version = "0.11.0", features = ["convert-detect"] }
indexmap = { version = "2.14.0", features = ["serde"] }
dialoguer = "0.12.0"
console = "0.16.3"
itertools = "0.15.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
