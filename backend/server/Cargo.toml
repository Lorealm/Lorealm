[package]
name = "lorealm_server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# In-house dependencies
lorealm_storage = { path = "../storage" }
lorealm_encryption = { path = "../encryption" }
lorealm_providers = { path = "../llm_providers"}
lorealm_plugins = { path = "../plugins" }

# Workspace dependencies
thiserror = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }

# Project-specific dependencies
axum = { version = "0.8.8", features = ["macros", "multipart"] }
tokio = { version = "1.51.0", features = ["full"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "set-header"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
dotenv = "0.15.0"
async-trait = "0.1.89"
tower-cookies = "0.11.0"
rand = "0.10.0"
rand_core = "0.10.0"
base64 = "0.22.1"
chrono = "0.4.44"
secrecy = "0.10.3"
unicode-normalization = "0.1.25"
futures-util = "0.3.32"
bitflags = { version = "2.11.0", features = ["serde"] }
crc32fast = "1.5.0"
weaver_lang = { version = "0.8.1", features = ["macros", "serde", "wtn"]}
context_weaver = "0.5.3"
serde_yaml = "0.9.34"
bytes = "1.11.1"
infer = "0.19.0"
async-stream = "0.3.6"
weaver_macros = "0.3.0"
schemars = "1.2.1"
tokio-util = "0.7.18"
dashmap = "6.2.1"
kitoken = { version = "0.11.0", features = ["convert-detect"] }
indexmap = { version = "2.14.0", features = ["serde"] }
dialoguer = "0.12.0"
console = "0.16.3"
itertools = "0.15.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
tempfile = "3.27.0"
hex = "0.4"
