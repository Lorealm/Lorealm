[package]
name = "lorealm_providers"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1.5"

[dev-dependencies]
tokio = { version = "1.35", features = ["full", "test-util"] }
