[package]
name = "lorealm_plugins"
version = "0.1.0"
edition = "2024"

[dependencies]
thiserror = { workspace = true }
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.6"
semver = { version = "1.0.28", features = ["serde"] }
wasmtime = "49.0.0"
wasmtime-wasi = "49.0.0"

[dev-dependencies]
tokio = { version = "1.51.0", features = ["macros", "rt-multi-thread"] }
