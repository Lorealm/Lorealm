<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#141018" />
    <title>Lorealm</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
        html,
        body,
        #app {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        /* Before the app's own style loads, so the first paint is not white. */
        html {
            background-color: #141018;
        }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
