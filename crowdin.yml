# Crowdin sync configuration: https://support.crowdin.com/developer/configuration-file/

project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN

preserve_hierarchy: true

files:
  - source: /frontend/packages/i18n/src/locales/en/*.json
    translation: /frontend/packages/i18n/src/locales/%two_letters_code%/%original_file_name%
    languages_mapping:
      two_letters_code:
        pt-BR: pt-BR
        pt-PT: pt-PT
        zh-CN: zh-CN
        zh-TW: zh-TW
        es-419: es-419
