[plugin]
name = "HypeBot"
handle = "hypebot"
description = "A little robot above the chat bar that cheers on your story."
tags = ["fun", "companion", "novelai"]
author = "Lorealm"
version = "0.1.0"
api = "0.1.0"
permissions = ["chat:read", "model:generate"]

[structure]
backend = "target/wasm32-wasip2/release/hypebot.wasm"

[build]
backend = ["cargo", "build", "--release", "--target", "wasm32-wasip2"]

[[frontend.slots]]
slot = "composer"
entry = "composer.html"
title = "HypeBot"
