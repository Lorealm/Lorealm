<!doctype html>
<html>
  <head>
    <style>
      body {
        margin: 0;
        display: flex;
        align-items: center;
        gap: var(--spacing-sm, 8px);
        color: var(--color-text-muted);
        font-size: var(--font-size-xs);
      }
      button {
        padding: 2px 10px;
        border: 1px solid var(--color-border-medium);
        border-radius: var(--radius-full, 999px);
        background: none;
        color: var(--color-text-secondary);
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #error {
        color: var(--color-error-text);
      }
    </style>
  </head>
  <body>
    <button id="listen" type="button">Listen</button>
    <span id="error"></span>
    <script>
      const button = document.getElementById('listen');
      const error = document.getElementById('error');
      let message = lorealm.context.message;
      let audio = null;

      function stop() {
        audio?.pause();
        audio = null;
        button.textContent = 'Listen';
      }

      async function listen() {
        stop();
        error.textContent = '';
        button.disabled = true;
        button.textContent = 'Loading…';
        try {
          const result = await lorealm.call('speak', { text: message.content });
          if (result.error) throw new Error(result.error);
          audio = new Audio(result.audio);
          audio.onended = stop;
          await audio.play();
          button.textContent = 'Stop';
        } catch (e) {
          stop();
          error.textContent = e.message;
        }
        button.disabled = false;
      }

      // Only replies that just finished, not ones already there when the
      // chat opened.
      async function autoplay() {
        if (Date.now() - Date.parse(message.updated_at) > 60_000) return;
        if (await lorealm.call('autoplay', { id: message.id })) await listen();
      }

      button.onclick = () => (audio ? stop() : listen());
      autoplay().catch(() => {});
      lorealm.onContext((context) => {
        const changed = context.message.id !== message.id;
        message = context.message;
        if (changed) {
          stop();
          autoplay().catch(() => {});
        }
      });
    </script>
  </body>
</html>
