version: "3.8"

services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=eldoria_hub
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - 5433:5432

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: development
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - ./plugin-api:/app/plugin-api
      - ./data:/app/data
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - target_cache:/app/target
    environment:
      - RUST_BACKTRACE=1
      - CARGO_WATCH_POLL=true
      - POSTGRES_URL=postgresql://postgres:root@postgres:5432/eldoria_hub
      - ELDORIA_SERVER_SECRET=InsanelySecureSecret726
    command: cargo watch -x run
    depends_on:
      - postgres

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:5173"

volumes:
  cargo_cache:
  cargo_git:
  target_cache:
  pgdata:
